<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Entrar — Povos da Floresta Cloud Controller</title>
  <meta name="description" content="Acesso restrito ao Cloud Controller Povos da Floresta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a12; --card: rgba(17, 24, 39, 0.72); --border: rgba(255,255,255,0.09);
      --text: #f8fafc; --muted: #94a3b8; --cyan: #00d2ff; --emerald: #10b981; --rose: #f43f5e; --blue: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; position: relative;
    }
    body::before, body::after {
      content: ''; position: fixed; width: 560px; height: 560px; border-radius: 50%; filter: blur(110px); opacity: .35; z-index: 0;
      animation: float 14s ease-in-out infinite alternate;
    }
    body::before { background: radial-gradient(circle, #10b981, transparent 70%); top: -180px; left: -140px; }
    body::after { background: radial-gradient(circle, #2563eb, transparent 70%); bottom: -200px; right: -160px; animation-delay: -6s; }
    @keyframes float { to { transform: translate(60px, 40px) scale(1.12); } }
    .card {
      position: relative; z-index: 1; width: 100%; max-width: 420px; background: var(--card);
      border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px 30px;
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
      animation: rise .6s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
    .logo {
      width: 60px; height: 60px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px;
      background: linear-gradient(135deg, rgba(16,185,129,.25), rgba(0,210,255,.18)); border: 1px solid rgba(16,185,129,.35);
      margin: 0 auto 18px; box-shadow: 0 0 30px rgba(16,185,129,.25);
    }
    h1 { font-size: 22px; text-align: center; font-weight: 700; letter-spacing: -.01em; }
    .sub { text-align: center; color: var(--muted); font-size: 13px; margin: 6px 0 26px; line-height: 1.5; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; letter-spacing: .02em; }
    input[type=text], input[type=password] {
      width: 100%; padding: 12px 14px; border-radius: 11px; border: 1px solid var(--border); background: rgba(8,11,19,.75);
      color: var(--text); font-size: 14px; font-family: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0,210,255,.15); }
    .check { display: flex; align-items: center; gap: 9px; margin: 16px 0 4px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
    .check input { accent-color: var(--emerald); width: 16px; height: 16px; }
    button.primary {
      width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 11px; cursor: pointer; font-family: inherit;
      font-size: 14px; font-weight: 700; color: #04130d; background: linear-gradient(135deg, #34d399, #00d2ff);
      transition: transform .15s, box-shadow .2s, opacity .2s; box-shadow: 0 8px 24px rgba(16,185,129,.3);
    }
    button.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(16,185,129,.4); }
    button.primary:disabled { opacity: .55; cursor: wait; transform: none; }
    .error {
      display: none; margin-top: 16px; padding: 10px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4;
      color: #fecdd3; background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.35);
    }
    .error.show { display: block; animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    .foot { text-align: center; margin-top: 22px; font-size: 11.5px; color: #64748b; }
    .hidden { display: none; }
    code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🌲</div>
    <h1 id="title">Povos da Floresta</h1>
    <p class="sub" id="subtitle">Cloud Controller — acesso restrito. Entre com suas credenciais.</p>

    <form id="auth-form" autocomplete="on" novalidate>
      <div id="setup-code-row" class="hidden">
        <label for="setup_code">Código de configuração inicial</label>
        <input type="text" id="setup_code" autocomplete="off" placeholder="XXXX-XXXX" spellcheck="false">
        <div class="hint">Exibido nos logs do servidor (Cloud Run) como <code>[SETUP]</code>.</div>
      </div>
      <div id="name-row" class="hidden">
        <label for="name">Nome completo</label>
        <input type="text" id="name" autocomplete="name" placeholder="Seu nome">
      </div>
      <label for="username">Usuário</label>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="usuario" autofocus>
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••••">
      <div id="setup-hint" class="hint hidden">Mínimo de 10 caracteres, com letras e números.</div>
      <label class="check" id="remember-row"><input type="checkbox" id="remember"> Manter conectado por 30 dias</label>
      <div class="error" id="error" role="alert"></div>
      <button type="submit" class="primary" id="submit-btn">Entrar</button>
    </form>
    <div class="foot">Sessão protegida • Conexão Povos da Floresta</div>
  </main>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      let setupMode = false;

      function showError(msg) {
        const el = $('error');
        el.textContent = msg;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
      }

      async function api(path, method, body) {
        const resp = await fetch(path, {
          method, credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined
        });
        let data = {};
        try { data = await resp.json(); } catch (_) {}
        return { status: resp.status, data };
      }

      async function init() {
        try {
          const { data } = await api('/api/auth/status', 'GET');
          if (data.authenticated) { location.reload(); return; }
          setupMode = !!data.setup_required;
        } catch (_) {}
        if (setupMode) {
          $('title').textContent = 'Configuração inicial';
          $('subtitle').textContent = 'Crie a conta do primeiro administrador da plataforma.';
          $('setup-code-row').classList.remove('hidden');
          $('name-row').classList.remove('hidden');
          $('setup-hint').classList.remove('hidden');
          $('remember-row').classList.add('hidden');
          $('password').setAttribute('autocomplete', 'new-password');
          $('submit-btn').textContent = 'Criar administrador';
          $('setup_code').focus();
        }
      }

      $('auth-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        $('error').classList.remove('show');
        const btn = $('submit-btn');
        const username = $('username').value.trim().toLowerCase();
        const password = $('password').value;
        if (!username || !password) { showError('Informe usuário e senha.'); return; }
        btn.disabled = true;
        const original = btn.textContent;
        btn.textContent = 'Aguarde...';
        try {
          let r;
          if (setupMode) {
            r = await api('/api/auth/setup', 'POST', {
              setup_code: $('setup_code').value.trim(), name: $('name').value.trim(), username, password
            });
          } else {
            r = await api('/api/auth/login', 'POST', { username, password, remember: $('remember').checked });
          }
          if (r.data && r.data.ok) {
            location.href = '/dashboard';
            return;
          }
          showError((r.data && r.data.error) || 'Não foi possível autenticar.');
        } catch (err) {
          showError('Falha de conexão com o servidor.');
        }
        btn.disabled = false;
        btn.textContent = original;
        $('password').select();
      });

      init();
    })();
  </script>
</body>
</html>
